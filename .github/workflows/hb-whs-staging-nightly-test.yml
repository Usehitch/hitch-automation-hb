# Workflow display name (shown in the Actions tab).
name: HB-WHS-STAGING Nightly Regression

# Events that start this workflow.
on:
  # Scheduled run. Cron is in UTC: "minute hour day month weekday".
  # '0 20 * * *' = every day at 20:00 UTC.
  schedule:
    - cron: '0 20 * * *'
  # Also run on every push to main (post-merge full validation).
  push:
    branches: [main]      # post-merge full validation
  workflow_dispatch:      # manual full run
  # NOTE: PRs and feature branches are handled by pr-tests.yml (scoped/fast),
  # so this heavy full regression no longer runs on pull_request.

# GITHUB_TOKEN permissions. "write" is required because the gh-pages deploy
# steps push the generated reports to the gh-pages branch.
permissions:
  contents: write

jobs:
  test:                                   # the single job
    timeout-minutes: 350                  # generous cap — the full suite + real API calls is slow
    runs-on: ubuntu-latest                # host VM

    container:
      # Run inside Playwright's official image (browsers + OS deps preinstalled, version-matched).
      image: mcr.microsoft.com/playwright:v1.59.1-jammy

    steps:
      - uses: actions/checkout@v4         # clone the repo

      - uses: actions/setup-node@v4       # install Node + enable npm cache
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci                       # reproducible install from package-lock.json

      # -----------------------------
      # Validate Secrets
      # -----------------------------
      - name: Validate required secrets
        run: |
          missing=""                                          # collect names of any missing secrets
          [ -z "$BASE_URL" ] && missing="$missing BASE_URL"   # -z = empty string
          [ -z "$EMAIL" ] && missing="$missing EMAIL"
          [ -z "$PASSWORD" ] && missing="$missing PASSWORD"
          [ -z "$OTP_SECRET" ] && missing="$missing OTP_SECRET"
          [ -z "$EMAIL_LO" ] && missing="$missing EMAIL_LO"
          [ -z "$PASSWORD_LO" ] && missing="$missing PASSWORD_LO"

          if [ -n "$missing" ]; then                          # -n = non-empty → something's missing
            echo "❌ Missing required secrets:$missing"
            exit 1                                            # abort the job early with a clear message
          fi

          echo "✅ All required secrets are present"
        env:
          # Map repo secrets into env vars for this step (masked in logs).
          BASE_URL: ${{ secrets.BASE_URL }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          OTP_SECRET: ${{ secrets.OTP_SECRET }}
          EMAIL_LO: ${{ secrets.EMAIL_LO }}
          PASSWORD_LO: ${{ secrets.PASSWORD_LO }}

      # -----------------------------
      # Run Playwright Tests
      # -----------------------------
      - name: Run Playwright tests
        id: playwright
        # continue-on-error: a failing suite does NOT stop the job here — the
        # reporting/Allure/Slack steps below must still run. We fail the job at
        # the very end (see "Fail workflow if tests failed").
        continue-on-error: true
        # rm -f first: test-results.json is generated output — if Playwright is
        # killed before writing a fresh one, NO file must be left behind, or the
        # reporting steps below would read a stale report and alert on phantom
        # results (this happened when a leftover copy was committed to the repo).
        run: |
          rm -f test-results.json
          npx playwright test
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          OTP_SECRET: ${{ secrets.OTP_SECRET }}
          # LO session creds — required by auth.setup.lo.js. Without these the
          # setup-lo project fails and every chromium-lo test is skipped.
          EMAIL_LO: ${{ secrets.EMAIL_LO }}
          PASSWORD_LO: ${{ secrets.PASSWORD_LO }}

      # -----------------------------
      # Install jq
      # -----------------------------
      - name: Install jq
        if: always()                                          # run even if tests failed (we need jq below)
        run: apt-get update -qq && apt-get install -y -qq jq  # jq = CLI JSON processor (-qq = quiet)

      # -----------------------------
      # Extract Test Statistics
      # -----------------------------
      - name: Extract test results
        if: ${{ !cancelled() }}
        run: |
          # Pull counts from Playwright's JSON report. "// 0" = default to 0 if the field is missing.
          # A missing report means Playwright died before writing it — treat that as a
          # failure (FAILED=?) so the failure alert fires instead of a phantom success.
          if [ -f test-results.json ]; then
            PASSED=$(jq '.stats.expected // 0' test-results.json)
            FAILED=$(jq '.stats.unexpected // 0' test-results.json)
            SKIPPED=$(jq '.stats.skipped // 0' test-results.json)
          else
            echo "::warning::test-results.json not found — Playwright produced no report."
            PASSED=0
            FAILED='?'
            SKIPPED=0
          fi

          # Persist to $GITHUB_ENV so later steps can read them as env.PASSED etc.
          echo "PASSED=$PASSED" >> $GITHUB_ENV
          echo "FAILED=$FAILED" >> $GITHUB_ENV
          echo "SKIPPED=$SKIPPED" >> $GITHUB_ENV

      # -----------------------------
      # Extract Failed Test Names
      # -----------------------------
      - name: Extract failed tests
        if: ${{ !cancelled() }}
        run: |
          # jq -r (raw output): for every spec that has any failed result, print its
          # title. ".." recurses the whole tree so specs nested inside describe()
          # suites are found too (".suites[].specs[]" only saw top-level specs).
          if [ -f test-results.json ]; then
            FAILED_TESTS=$(jq -r '
              .. | .specs? // empty | .[] |
              select(any(.tests[]?.results[]?; .status=="failed")) |
              .title
            ' test-results.json)
          else
            FAILED_TESTS='(no test report produced — Playwright crashed or was killed before writing results)'
          fi

          # Write a possibly-multiline value to $GITHUB_ENV using heredoc syntax.
          # "${FAILED_TESTS:-None}" prints "None" if the variable is empty.
          {
            echo "FAILED_TESTS<<EOF"
            echo "${FAILED_TESTS:-None}"
            echo "EOF"
          } >> $GITHUB_ENV

      # -----------------------------
      # Business digest — translate spec results into stakeholder language
      # ("what's working / what's broken by business capability") for the Slack
      # alerts below. The spec → capability mapping lives in
      # scripts/capability-map.json; scripts/business-digest.js never exits
      # non-zero, so a digest problem can't break the alerts.
      # -----------------------------
      - name: Build business digest
        if: ${{ !cancelled() }}
        run: |
          if [ -f test-results.json ]; then
            DIGEST=$(node scripts/business-digest.js test-results.json)
            SUMMARY=$(node scripts/business-digest.js test-results.json --summary)
          else
            DIGEST='(business digest unavailable — no test report produced)'
            SUMMARY=''
          fi
          {
            echo "BUSINESS_DIGEST<<EOF"
            echo "$DIGEST"
            echo "EOF"
            echo "BUSINESS_SUMMARY<<EOF"
            echo "$SUMMARY"
            echo "EOF"
          } >> $GITHUB_ENV

      # -----------------------------
      # Allure: restore history JSONL across runs (trends / flakiness)
      # Allure 3 keeps ALL history in one file; restore-keys grabs the most
      # recent cache, and the unique run_id key always saves the updated file.
      # -----------------------------
      - name: Restore Allure history
        uses: actions/cache@v4
        if: always()
        with:
          path: allure-history.jsonl                          # the single file Allure 3 stores history in
          key: allure-history-${{ github.run_id }}            # unique per run → cache always saves a fresh copy at job end
          restore-keys: |
            allure-history-                                   # prefix match → restores the most recent previous cache

      # -----------------------------
      # Allure: strip spurious "skipped" twin results that allure-playwright's
      # addSkippedResults() emits for this multi-project setup (otherwise the
      # report can render every test as skipped). See scripts/allure-dedupe.js.
      # -----------------------------
      - name: Deduplicate Allure results
        if: always()
        run: node scripts/allure-dedupe.js allure-results

      # -----------------------------
      # Allure: generate report (reads + appends allure-history.jsonl;
      # output dir + historyPath come from allurerc.mjs)
      # -----------------------------
      - name: Generate Allure report
        if: always()
        # Block scalar (run: |) so the '#' in the --name value is treated as a
        # literal, not a YAML comment. As a plain scalar, YAML truncates the line
        # at " #...", producing an unterminated quoted string that crashes sh.
        run: |
          npx allure generate allure-results --name "Homebridge Nightly #${{ github.run_number }}"

      # -----------------------------
      # Upload Playwright Report
      # -----------------------------
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30                                  # keep the artifact for 30 days

      # -----------------------------
      # Upload Allure Report
      # -----------------------------
      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      # -----------------------------
      # Strip traces/videos from the copies published to gh-pages. Pages
      # deploys the whole branch as ONE artifact hard-capped at 1 GB, and
      # trace zips/videos are ~90% of a run's size. The full reports (with
      # traces) live in the Actions artifacts uploaded above.
      # -----------------------------
      - name: Strip traces/videos from published reports
        if: always()
        run: find playwright-report allure-report -type f \( -name '*.zip' -o -name '*.webm' \) -delete || true

      # -----------------------------
      # Deploy Report to GitHub Pages
      # -----------------------------
      - name: Deploy report to gh-pages
        uses: peaceiris/actions-gh-pages@v4                   # pushes a folder to the gh-pages branch
        if: always()
        with:
          github_token: ${{ secrets.HB_TOKEN }}               # PAT with push rights to gh-pages
          publish_dir: playwright-report/                     # folder to publish
          destination_dir: reports/${{ github.run_id }}       # publish under reports/<run_id>/ (one per run)
          keep_files: true                                    # don't wipe other folders already on gh-pages

      # -----------------------------
      # Deploy Allure Report to GitHub Pages (allure/<run_id>/)
      # keep_files preserves the existing reports/ tree.
      # -----------------------------
      - name: Deploy Allure report to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.HB_TOKEN }}
          publish_dir: allure-report/
          destination_dir: allure/${{ github.run_id }}        # publish under allure/<run_id>/
          keep_files: true

      # -----------------------------
      # Slack Success Alert — quiet one-line digest, nightly/main only.
      # PR runs are intentionally skipped (GitHub PR checks already show status),
      # which keeps the channel free of routine green pings.
      # -----------------------------
      - name: Slack Alert - Test Success
        # !cancelled() (not always()): a failure in an earlier step (e.g.
        # Allure/gh-pages) still can't suppress the alert via the implicit
        # success() gate, but a CANCELLED run — which has no real results —
        # never alerts. Only when zero failures AND not a PR event.
        if: ${{ !cancelled() && env.FAILED == '0' && github.event_name != 'pull_request' }}
        run: |
          ALLURE_REPORT="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure/${{ github.run_id }}/"
          # <url|label> is Slack's hyperlink syntax.
          TEXT="✅ *HB-WHS-STG Nightly Passed* — ${PASSED} passed, ${SKIPPED} skipped on HB staging (\`${{ github.ref_name }}\`). ${BUSINESS_SUMMARY}. 🟣 <${ALLURE_REPORT}|Allure trends>"
          # jq -n --arg builds a safely-escaped JSON body; curl POSTs it (-d @- reads from stdin).
          jq -n --arg t "$TEXT" '{channel:"#automation-alerts", text:$t}' \
          | curl -sS -X POST -H 'Content-type: application/json' -d @- ${{ secrets.SLACK_WEBHOOK_URL }}

      # -----------------------------
      # Slack Failure Alert — self-contained and actionable: includes the
      # failed test names (already computed in FAILED_TESTS), @here, and links.
      # Built with jq so test titles with quotes/newlines can't break the JSON.
      # PR runs skipped (covered by GitHub PR checks).
      # -----------------------------
      - name: Slack Alert - Test Failed
        # !cancelled() (not always()): a failure in an earlier step (e.g.
        # Allure/gh-pages) still can't suppress the alert via the implicit
        # success() gate, but a CANCELLED run — which has no real results —
        # never alerts. Only when there are failures AND not a PR event.
        if: ${{ !cancelled() && env.FAILED != '0' && github.event_name != 'pull_request' }}
        run: |
          RUN_REPORT="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/${{ github.run_id }}/"
          ALLURE_REPORT="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure/${{ github.run_id }}/"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Prefix each failed test with a bullet for readability
          FAILED_LIST=$(printf '%s\n' "$FAILED_TESTS" | sed 's/^/• /')

          # Build the message with printf so every line stays indented inside
          # the YAML block scalar (raw multiline strings dedented to column 0
          # would terminate the block and break YAML parsing).
          TEXT=$(printf '%s\n' \
            "❌ *HB-WHS-STG Nightly Failed* (HB staging) <!here>" \
            "📦 ${{ github.repository }} (\`${{ github.ref_name }}\`)" \
            "📈 Passed: ${PASSED} | Failed: ${FAILED} | Skipped: ${SKIPPED}" \
            "" \
            "${BUSINESS_DIGEST}" \
            "" \
            "*Failed tests:*" \
            "${FAILED_LIST}" \
            "" \
            "🚨 Playwright report: ${RUN_REPORT}" \
            "🟣 Allure (trends/flakiness): ${ALLURE_REPORT}" \
            "🔍 Run logs: ${RUN_URL}")

          jq -n --arg t "$TEXT" '{channel:"#automation-alerts", text:$t}' \
          | curl -sS -X POST -H 'Content-type: application/json' -d @- ${{ secrets.SLACK_WEBHOOK_URL }}

      # -----------------------------
      # Upload failure screenshots to Slack (bot token; up to 10, one per
      # failing spec). Best-effort — the script never fails the job, so a Slack
      # hiccup can't mask the real test failure. PR runs skipped (covered by
      # GitHub PR checks, matching the Slack text alerts above).
      # Needs secrets: SLACK_BOT_TOKEN (xoxb-…, files:write) + SLACK_CHANNEL_ID
      # (numeric ID), and the bot must be a member of #automation-alerts.
      # -----------------------------
      - name: Upload failure screenshots to Slack
        if: ${{ !cancelled() && env.FAILED != '0' && github.event_name != 'pull_request' }}
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_CAPTION: "🖼️ *HB-WHS-STG Nightly #${{ github.run_number }}* (`${{ github.ref_name }}`) — failure screenshots (${{ env.FAILED }} failed). Report: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/${{ github.run_id }}/"
        run: node scripts/slack-upload-screenshots.js test-results.json 10

      # -----------------------------
      # Bug-report classifier (nightly schedule only — the confirmation
      # threshold counts consecutive *nightly* runs). Filters flaky/infra,
      # requires 2 consecutive nightly failures, dedups, and guards against
      # environment outages. State persists across nights via actions/cache.
      # -----------------------------
      - name: Restore failure-tracking state
        uses: actions/cache@v4
        # schedule-only: "consecutive nightlies" must mean nightly runs.
        # !cancelled(): a cancelled nightly has no real results and must not
        # advance/reset the per-test failure streaks.
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        with:
          path: failure-state.json                            # per-test streak/notified state
          key: failure-state-${{ github.run_id }}
          restore-keys: |
            failure-state-

      - name: Classify failures
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        run: node scripts/classify-failures.js test-results.json failure-state.json  # writes slack-bug-report.json when there's something to report

      - name: Slack Alert - Confirmed regressions
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        run: |
          if [ -s slack-bug-report.json ]; then               # -s = file exists and is non-empty
            curl -sS -X POST -H 'Content-type: application/json' \
              -d @slack-bug-report.json ${{ secrets.SLACK_WEBHOOK_URL }}   # the classifier already built the payload
          else
            echo "No confirmed regressions to report."
          fi

      # -----------------------------
      # Mark Workflow Failed
      # -----------------------------
      # The test step used continue-on-error, so the job is still "green" here.
      # Fail it explicitly if any test failed, so the run shows red.
      - name: Fail workflow if tests failed
        if: env.FAILED != '0'
        run: |
          echo "One or more tests failed."
          exit 1
