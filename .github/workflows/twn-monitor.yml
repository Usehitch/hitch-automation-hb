name: TWN Vendor Monitor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  twn-monitor:
    name: The Work Number — Integration Check
    timeout-minutes: 60
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # -----------------------------
      # Validate secrets early
      # -----------------------------
      - name: Validate required secrets
        run: |
          missing=""
          [ -z "$BASE_URL" ] && missing="$missing BASE_URL"
          [ -z "$EMAIL" ] && missing="$missing EMAIL"
          [ -z "$PASSWORD" ] && missing="$missing PASSWORD"
          [ -z "$OTP_SECRET" ] && missing="$missing OTP_SECRET"

          if [ -n "$missing" ]; then
            echo "❌ Missing required secrets:$missing"
            exit 1
          fi

          echo "✅ All required secrets are present"
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          OTP_SECRET: ${{ secrets.OTP_SECRET }}

      # -----------------------------
      # Run TWN monitor
      # -----------------------------
      - name: Run TWN monitor test
        id: twn_test
        run: npx playwright test tests/twn-monitor.spec.js --reporter=list
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          OTP_SECRET: ${{ secrets.OTP_SECRET }}

      # -----------------------------
      # Upload report
      # -----------------------------
      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: twn-monitor-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 7

      # -----------------------------
      # Slack Failure Alert (WITH LINKS)
      # -----------------------------
      - name: Notify Slack on failure
        if: failure()
        continue-on-error: true
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "🚨 TWN Integration Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🚨 *TWN Integration Alert*\n\nThe Work Number integration check FAILED.\n\n📦 *Repo:* ${{ github.repository }}\n🌿 *Event:* ${{ github.event_name }}\n\n📊 *Reports:*\n🔹 Run: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/${{ github.run_id }}/\n🔹 Latest: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/latest/\n\n🔍 *GitHub Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open Logs>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK