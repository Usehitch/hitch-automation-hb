name: TWN Vendor Monitor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  twn-monitor:
    name: The Work Number — Integration Check
    timeout-minutes: 60
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------
      # Setup Node
      # -----------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # -----------------------------
      # Validate secrets
      # -----------------------------
      - name: Validate required secrets
        run: |
          missing=""
          [ -z "$BASE_URL" ] && missing="$missing BASE_URL"
          [ -z "$EMAIL" ] && missing="$missing EMAIL"
          [ -z "$PASSWORD" ] && missing="$missing PASSWORD"
          [ -z "$OTP_SECRET" ] && missing="$missing OTP_SECRET"

          if [ -n "$missing" ]; then
            echo "❌ Missing required secrets:$missing"
            exit 1
          fi

          echo "✅ All required secrets are present"
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          OTP_SECRET: ${{ secrets.OTP_SECRET }}

      # -----------------------------
      # Run TWN Monitor Test
      # -----------------------------
      - name: Run TWN monitor test
        # Filename regex (not a path) — matches tests/Broker Flow/twn-monitor.spec.js
        # without the space/separator fragility of a full path argument.
        run: npx playwright test twn-monitor
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          OTP_SECRET: ${{ secrets.OTP_SECRET }}

      # -----------------------------
      # Upload Playwright Report
      # -----------------------------
      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: twn-monitor-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 7

      # -----------------------------
      # Deploy Report to GitHub Pages
      # -----------------------------
      - name: Deploy report to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ !cancelled() }}
        with:
          github_token: ${{ secrets.HB_TOKEN }}
          publish_dir: playwright-report/
          destination_dir: twn-monitor/${{ github.run_id }}
          keep_files: true

      # -----------------------------
      # Slack Success Alert
      # -----------------------------
      - name: Slack Alert - TWN Success
        if: success()
        run: |
          RUN_REPORT="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/twn-monitor/${{ github.run_id }}/"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -X POST -H 'Content-type: application/json' \
          --data "{
            \"channel\": \"#automation-alerts\",
            \"text\": \"✅ *TWN Integration Check Passed*\n\n📦 Repo: ${{ github.repository }}\n🌿 Event: ${{ github.event_name }}\n\n📊 Report:\n🔹 ${RUN_REPORT}\n\n🔍 GitHub Run: ${RUN_URL}\"
          }" \
          ${{ secrets.SLACK_WEBHOOK_URL }}

      # -----------------------------
      # Slack Failure Alert
      # -----------------------------
      - name: Slack Alert - TWN Failure
        if: failure()
        run: |
          RUN_REPORT="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/twn-monitor/${{ github.run_id }}/"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -X POST -H 'Content-type: application/json' \
          --data "{
            \"channel\": \"#automation-alerts\",
            \"text\": \"🚨 *TWN Integration Check Failed*\n\n📦 Repo: ${{ github.repository }}\n🌿 Event: ${{ github.event_name }}\n\n📊 Report:\n🔹 ${RUN_REPORT}\n\n🔍 Logs: ${RUN_URL}\"
          }" \
          ${{ secrets.SLACK_WEBHOOK_URL }}

      # -----------------------------
      # Upload failure screenshot to Slack (bot token; the failing monitor
      # spec's screenshot). Best-effort — the script never fails the job.
      # Needs secrets: SLACK_BOT_TOKEN (xoxb-…, files:write) + SLACK_CHANNEL_ID,
      # and the bot must be a member of that channel.
      # -----------------------------
      - name: Upload failure screenshot to Slack
        if: failure()
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_CAPTION: "🖼️ *TWN Integration Check Failed* — screenshot. Report: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/twn-monitor/${{ github.run_id }}/"
        run: node scripts/slack-upload-screenshots.js test-results.json 10

      # -----------------------------------------------------------------------
      # Email alert — production outage only (TWN failure).
      # Fires when the integration check fails; does NOT send on success.
      #
      # Required secrets (Settings → Secrets and variables → Actions):
      #   SMTP_SERVER    — e.g. smtp.office365.com
      #   SMTP_PORT      — e.g. 587
      #   SMTP_USERNAME  — sending address (e.g. alerts@homebridge.com)
      #   SMTP_PASSWORD  — app password / service account password
      #
      # continue-on-error: true so a bad SMTP config never masks the real failure.
      # -----------------------------------------------------------------------
      - name: Email Alert - TWN Production Outage
        if: failure()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port:    ${{ secrets.SMTP_PORT }}
          username:       ${{ secrets.SMTP_USERNAME }}
          password:       ${{ secrets.SMTP_PASSWORD }}
          to:             HELIX_Notification@homebridge.com
          from:           ${{ secrets.SMTP_USERNAME }}
          subject:        "🚨 [PRODUCTION OUTAGE] TWN Integration Check Failed — ${{ github.run_id }}"
          body: |
            The Work Number (TWN) income verification integration has FAILED on production.

            Automated employer-data population may be broken for new loan applications.

            ──────────────────────────────────────
            Repository : ${{ github.repository }}
            Triggered  : ${{ github.event_name }}
            Run ID     : ${{ github.run_id }}
            ──────────────────────────────────────

            Test Report:
            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/twn-monitor/${{ github.run_id }}/

            GitHub Actions Run:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ──────────────────────────────────────
            This alert is sent only on failure.
            No action needed if the next scheduled run passes.