name: TWN Vendor Monitor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  twn-monitor:
    name: The Work Number — Integration Check
    timeout-minutes: 60
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------
      # Setup Node
      # -----------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # -----------------------------
      # Validate secrets
      # -----------------------------
      - name: Validate required secrets
        run: |
          missing=""
          [ -z "$BASE_URL" ] && missing="$missing BASE_URL"
          [ -z "$EMAIL" ] && missing="$missing EMAIL"
          [ -z "$PASSWORD" ] && missing="$missing PASSWORD"
          [ -z "$OTP_SECRET" ] && missing="$missing OTP_SECRET"

          if [ -n "$missing" ]; then
            echo "❌ Missing required secrets:$missing"
            exit 1
          fi

          echo "✅ All required secrets are present"
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          OTP_SECRET: ${{ secrets.OTP_SECRET }}

      # -----------------------------
      # Run TWN Monitor Test
      # -----------------------------
      - name: Run TWN monitor test
        run: npx playwright test tests/twn-monitor.spec.js
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          OTP_SECRET: ${{ secrets.OTP_SECRET }}

      # -----------------------------
      # Upload Playwright Report
      # -----------------------------
      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: twn-monitor-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 7

      # -----------------------------
      # Deploy Report to GitHub Pages
      # -----------------------------
      - name: Deploy report to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ !cancelled() }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: playwright-report/
          destination_dir: twn-monitor/${{ github.run_id }}
          keep_files: true

      # -----------------------------
      # Slack Success Alert
      # -----------------------------
      - name: Slack Alert - TWN Success
        if: success()
        run: |
          RUN_REPORT="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/twn-monitor/${{ github.run_id }}/"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -X POST -H 'Content-type: application/json' \
          --data "{
            \"channel\": \"#automation-alerts\",
            \"text\": \"✅ *TWN Integration Check Passed*\n\n📦 Repo: ${{ github.repository }}\n🌿 Event: ${{ github.event_name }}\n\n📊 Report:\n🔹 ${RUN_REPORT}\n\n🔍 GitHub Run: ${RUN_URL}\"
          }" \
          ${{ secrets.SLACK_WEBHOOK_URL }}

      # -----------------------------
      # Slack Failure Alert
      # -----------------------------
      - name: Slack Alert - TWN Failure
        if: failure()
        run: |
          RUN_REPORT="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/twn-monitor/${{ github.run_id }}/"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -X POST -H 'Content-type: application/json' \
          --data "{
            \"channel\": \"#automation-alerts\",
            \"text\": \"🚨 *TWN Integration Check Failed*\n\n📦 Repo: ${{ github.repository }}\n🌿 Event: ${{ github.event_name }}\n\n📊 Report:\n🔹 ${RUN_REPORT}\n\n🔍 Logs: ${RUN_URL}\"
          }" \
          ${{ secrets.SLACK_WEBHOOK_URL }}