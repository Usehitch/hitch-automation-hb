# Workflow display name (shown in the Actions tab).
name: HB-WHS-PROD Nightly Regression

# ---------------------------------------------------------------------------
# Scoped nightly regression for the Homebridge WHS *production* HELOC portal
# (hbwheloc.homebridge.com). Runs ONLY the curated spec list below — not the
# full suite — against prod, using a dedicated set of HBW_PROD_* secrets so it
# never touches the staging creds used by nightly-test.yml.
#
# Both the broker session (chromium) and the LO session (chromium-lo) log in
# with the SAME prod MLO account: the workflow maps the one prod credential
# into both EMAIL/PASSWORD and EMAIL_LO/PASSWORD_LO.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   HBW_PROD_BASE_URL   → https://hbwheloc.homebridge.com/portal
#   HBW_PROD_EMAIL      → prod_helix_hbw_mlo@homebridge.com
#   HBW_PROD_PASSWORD   → (the prod MLO password)
# Reused (shared with the other workflows):
#   HB_TOKEN            → PAT with push rights to gh-pages
#   SLACK_WEBHOOK_URL   → Slack incoming webhook
# ---------------------------------------------------------------------------

on:
  # Scheduled run. Cron is in UTC: "minute hour day month weekday".
  # '0 8 * * *' = 08:00 UTC daily (~1 AM PST / midnight PDT) — off-peak, and
  # deliberately offset from the staging nightly (20:00 UTC) so the two prod
  # vs staging runs never contend for runners or report trends.
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:      # manual run from the Actions tab

# Never let two prod runs overlap (a manual dispatch on top of the nightly, etc.)
concurrency:
  group: hb-whs-prod-nightly
  cancel-in-progress: false   # let an in-flight prod run finish rather than killing it

# GITHUB_TOKEN permissions. "write" is required because the gh-pages deploy
# steps push the generated reports to the gh-pages branch.
permissions:
  contents: write

jobs:
  test:
    name: HB-WHS-PROD — Scoped Nightly Regression
    timeout-minutes: 120                  # generous cap — real API calls (credit pull, employment verify) are slow
    runs-on: ubuntu-latest

    container:
      # Run inside Playwright's official image (browsers + OS deps preinstalled, version-matched).
      image: mcr.microsoft.com/playwright:v1.59.1-jammy

    steps:
      - uses: actions/checkout@v4         # clone the repo

      - uses: actions/setup-node@v4       # install Node + enable npm cache
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci                       # reproducible install from package-lock.json

      # -----------------------------
      # Validate Secrets
      # -----------------------------
      - name: Validate required secrets
        run: |
          missing=""
          [ -z "$HBW_PROD_BASE_URL" ] && missing="$missing HBW_PROD_BASE_URL"
          [ -z "$HBW_PROD_EMAIL" ] && missing="$missing HBW_PROD_EMAIL"
          [ -z "$HBW_PROD_PASSWORD" ] && missing="$missing HBW_PROD_PASSWORD"

          if [ -n "$missing" ]; then
            echo "❌ Missing required secrets:$missing"
            exit 1
          fi

          echo "✅ All required secrets are present"
        env:
          HBW_PROD_BASE_URL: ${{ secrets.HBW_PROD_BASE_URL }}
          HBW_PROD_EMAIL: ${{ secrets.HBW_PROD_EMAIL }}
          HBW_PROD_PASSWORD: ${{ secrets.HBW_PROD_PASSWORD }}

      # -----------------------------
      # Run the curated prod spec list
      # -----------------------------
      # Exact file paths are passed (Playwright matches them as anchored
      # regexes). This avoids the substring trap — a bare "active" filter would
      # also match inactive/reactivate-user/deactivate-user. Each path is routed
      # to the correct project by playwright.config.js: Broker-session specs run
      # under `chromium` (setup → broker login), LO-session specs under
      # `chromium-lo` (setup-lo → LO login). Both setups log in with the same
      # prod MLO account because EMAIL_LO/PASSWORD_LO are mapped to it below.
      - name: Run Playwright tests (prod scope)
        id: playwright
        # continue-on-error: a failing suite does NOT stop the job here — the
        # reporting/Allure/Slack steps below must still run. We fail the job at
        # the very end (see "Fail workflow if tests failed").
        continue-on-error: true
        # rm -f first: test-results.json is generated output — if Playwright is
        # killed before writing a fresh one, NO file must be left behind, or the
        # reporting steps below would read a stale report and alert on phantom
        # results (this happened when a leftover copy was committed to the repo).
        run: |
          rm -f test-results.json
          npx playwright test \
            "tests/Broker Flow/shadow-borrower-view.spec.js" \
            "tests/Broker Flow/twn-monitor.spec.js" \
            "tests/Broker Flow/credit-and-income.spec.js" \
            "tests/Broker Flow/pre-qual-manual.spec.js" \
            "tests/Broker Flow/econsent.spec.js" \
            "tests/Broker Flow/My Loans/adversed.spec.js" \
            "tests/Broker Flow/My Loans/inactive.spec.js" \
            "tests/Borrower Flow/support.spec.js" \
            "tests/LO Flow/pipeline-management.spec.js" \
            "tests/LO Flow/deal-optimization.spec.js" \
            "tests/LO Flow/property-applicant-data.spec.js" \
            "tests/Borrower Flow/invitation.spec.js" \
            "tests/Borrower Flow/Co-Borrower/coborrower.spec.js" \
            "tests/Borrower Flow/Co-Borrower/verification-documentation.spec.js" \
            "tests/Borrower Flow/Co-Borrower/loan-hub.spec.js"
          # Excluded from prod scope: loandetail.spec.js, My Loans/active.spec.js,
          # LO Flow/certifications.spec.js — all search for a hardcoded fixture
          # loan (SHARED name/address, "4556 Eliot St") seeded on staging only.
          # They still run in the staging nightly where that data exists.
        env:
          # Point the whole run at production.
          BASE_URL: ${{ secrets.HBW_PROD_BASE_URL }}
          # Broker session (chromium) creds.
          EMAIL: ${{ secrets.HBW_PROD_EMAIL }}
          PASSWORD: ${{ secrets.HBW_PROD_PASSWORD }}
          # LO session (chromium-lo) creds — reuse the same prod MLO account so
          # the LO-flow specs authenticate without a second login.
          EMAIL_LO: ${{ secrets.HBW_PROD_EMAIL }}
          PASSWORD_LO: ${{ secrets.HBW_PROD_PASSWORD }}

      # -----------------------------
      # Install jq
      # -----------------------------
      - name: Install jq
        if: always()
        run: apt-get update -qq && apt-get install -y -qq jq

      # -----------------------------
      # Extract Test Statistics
      # -----------------------------
      - name: Extract test results
        if: ${{ !cancelled() }}
        run: |
          # Pull counts from Playwright's JSON report. "// 0" = default to 0 if the field is missing.
          # A missing report means Playwright died before writing it — treat that as a
          # failure (FAILED=?) so the failure alert fires instead of a phantom success.
          if [ -f test-results.json ]; then
            PASSED=$(jq '.stats.expected // 0' test-results.json)
            FAILED=$(jq '.stats.unexpected // 0' test-results.json)
            SKIPPED=$(jq '.stats.skipped // 0' test-results.json)
          else
            echo "::warning::test-results.json not found — Playwright produced no report."
            PASSED=0
            FAILED='?'
            SKIPPED=0
          fi

          echo "PASSED=$PASSED" >> $GITHUB_ENV
          echo "FAILED=$FAILED" >> $GITHUB_ENV
          echo "SKIPPED=$SKIPPED" >> $GITHUB_ENV

      # -----------------------------
      # Extract Failed Test Names
      # -----------------------------
      - name: Extract failed tests
        if: ${{ !cancelled() }}
        run: |
          # jq -r (raw output): for every spec that has any failed result, print its
          # title. ".." recurses the whole tree so specs nested inside describe()
          # suites are found too (".suites[].specs[]" only saw top-level specs).
          if [ -f test-results.json ]; then
            FAILED_TESTS=$(jq -r '
              .. | .specs? // empty | .[] |
              select(any(.tests[]?.results[]?; .status=="failed")) |
              .title
            ' test-results.json)
          else
            FAILED_TESTS='(no test report produced — Playwright crashed or was killed before writing results)'
          fi

          {
            echo "FAILED_TESTS<<EOF"
            echo "${FAILED_TESTS:-None}"
            echo "EOF"
          } >> $GITHUB_ENV

      # -----------------------------
      # Business digest — translate spec results into stakeholder language
      # ("what's working / what's broken by business capability") for the Slack
      # alerts below. The spec → capability mapping lives in
      # scripts/capability-map.json; scripts/business-digest.js never exits
      # non-zero, so a digest problem can't break the alerts.
      # -----------------------------
      - name: Build business digest
        if: ${{ !cancelled() }}
        run: |
          if [ -f test-results.json ]; then
            DIGEST=$(node scripts/business-digest.js test-results.json)
            SUMMARY=$(node scripts/business-digest.js test-results.json --summary)
          else
            DIGEST='(business digest unavailable — no test report produced)'
            SUMMARY=''
          fi
          {
            echo "BUSINESS_DIGEST<<EOF"
            echo "$DIGEST"
            echo "EOF"
            echo "BUSINESS_SUMMARY<<EOF"
            echo "$SUMMARY"
            echo "EOF"
          } >> $GITHUB_ENV

      # -----------------------------
      # Allure: restore history JSONL across runs (trends / flakiness).
      # Prod-namespaced cache key keeps these trends separate from the staging
      # nightly's history.
      # -----------------------------
      - name: Restore Allure history
        uses: actions/cache@v4
        if: always()
        with:
          path: allure-history.jsonl
          key: allure-history-hbwprod-${{ github.run_id }}
          restore-keys: |
            allure-history-hbwprod-

      # -----------------------------
      # Allure: strip spurious "skipped" twin results (see scripts/allure-dedupe.js).
      # -----------------------------
      - name: Deduplicate Allure results
        if: always()
        run: node scripts/allure-dedupe.js allure-results

      # -----------------------------
      # Allure: generate report (reads + appends allure-history.jsonl).
      # -----------------------------
      - name: Generate Allure report
        if: always()
        run: |
          npx allure generate allure-results --name "HB-WHS-PROD Nightly #${{ github.run_number }}"

      # -----------------------------
      # Upload Playwright Report
      # -----------------------------
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hb-whs-prod-playwright-report
          path: playwright-report/
          retention-days: 30

      # -----------------------------
      # Upload Allure Report
      # -----------------------------
      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hb-whs-prod-allure-report
          path: allure-report/
          retention-days: 30

      # -----------------------------
      # Strip traces/videos from the copies published to gh-pages. Pages
      # deploys the whole branch as ONE artifact hard-capped at 1 GB, and
      # trace zips/videos are ~90% of a run's size. The full reports (with
      # traces) live in the Actions artifacts uploaded above.
      # -----------------------------
      - name: Strip traces/videos from published reports
        if: always()
        run: find playwright-report allure-report -type f \( -name '*.zip' -o -name '*.webm' \) -delete || true

      # -----------------------------
      # Deploy Reports to GitHub Pages (prod-namespaced dirs so they never
      # clobber the staging nightly's reports/ and allure/ trees).
      # -----------------------------
      - name: Deploy Playwright report to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.HB_TOKEN }}
          publish_dir: playwright-report/
          destination_dir: hb-whs-prod/reports/${{ github.run_id }}
          keep_files: true

      - name: Deploy Allure report to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.HB_TOKEN }}
          publish_dir: allure-report/
          destination_dir: hb-whs-prod/allure/${{ github.run_id }}
          keep_files: true

      # -----------------------------
      # Slack Success Alert — quiet one-line digest.
      # -----------------------------
      - name: Slack Alert - Test Success
        # !cancelled() (not always()): a failure in an earlier step (e.g.
        # Allure/gh-pages) still can't suppress the alert via the implicit
        # success() gate, but a CANCELLED run — which has no real results —
        # never alerts. Only when zero failures.
        if: ${{ !cancelled() && env.FAILED == '0' }}
        run: |
          ALLURE_REPORT="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/hb-whs-prod/allure/${{ github.run_id }}/"
          TEXT="✅ *HB-WHS-PROD Nightly Passed* — ${PASSED} passed, ${SKIPPED} skipped on prod. ${BUSINESS_SUMMARY}. 🟣 <${ALLURE_REPORT}|Allure trends>"
          jq -n --arg t "$TEXT" '{channel:"#automation-alerts", text:$t}' \
          | curl -sS -X POST -H 'Content-type: application/json' -d @- ${{ secrets.SLACK_WEBHOOK_URL }}

      # -----------------------------
      # Slack Failure Alert — actionable: includes failed test names + links.
      # -----------------------------
      - name: Slack Alert - Test Failed
        # !cancelled() (not always()): a failure in an earlier step (e.g.
        # Allure/gh-pages) still can't suppress the alert via the implicit
        # success() gate, but a CANCELLED run — which has no real results —
        # never alerts. Only when there are failures.
        if: ${{ !cancelled() && env.FAILED != '0' }}
        run: |
          RUN_REPORT="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/hb-whs-prod/reports/${{ github.run_id }}/"
          ALLURE_REPORT="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/hb-whs-prod/allure/${{ github.run_id }}/"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          FAILED_LIST=$(printf '%s\n' "$FAILED_TESTS" | sed 's/^/• /')

          TEXT=$(printf '%s\n' \
            "❌ *HB-WHS-PROD Nightly Failed* <!here>" \
            "📦 ${{ github.repository }} — production HELOC portal" \
            "📈 Passed: ${PASSED} | Failed: ${FAILED} | Skipped: ${SKIPPED}" \
            "" \
            "${BUSINESS_DIGEST}" \
            "" \
            "*Failed tests:*" \
            "${FAILED_LIST}" \
            "" \
            "🚨 Playwright report: ${RUN_REPORT}" \
            "🟣 Allure (trends/flakiness): ${ALLURE_REPORT}" \
            "🔍 Run logs: ${RUN_URL}")

          jq -n --arg t "$TEXT" '{channel:"#automation-alerts", text:$t}' \
          | curl -sS -X POST -H 'Content-type: application/json' -d @- ${{ secrets.SLACK_WEBHOOK_URL }}

      # -----------------------------
      # Upload failure screenshots to Slack (bot token; up to 10, one per
      # failing spec). Best-effort — the script never fails the job, so a Slack
      # hiccup can't mask the real test failure.
      # Needs secrets: SLACK_BOT_TOKEN (xoxb-…, files:write) + SLACK_CHANNEL_ID
      # (numeric ID), and the bot must be a member of #automation-alerts.
      # -----------------------------
      - name: Upload failure screenshots to Slack
        if: ${{ !cancelled() && env.FAILED != '0' }}
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_CAPTION: "🖼️ *HB-WHS-PROD Nightly #${{ github.run_number }}* — failure screenshots (${{ env.FAILED }} failed). Report: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/hb-whs-prod/reports/${{ github.run_id }}/"
        run: node scripts/slack-upload-screenshots.js test-results.json 10

      # -----------------------------
      # Mark Workflow Failed — the test step used continue-on-error, so fail
      # the job explicitly here if any test failed (so the run shows red).
      # -----------------------------
      - name: Fail workflow if tests failed
        if: env.FAILED != '0'
        run: |
          echo "One or more tests failed."
          exit 1
