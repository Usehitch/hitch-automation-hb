name: Nightly Regression Tests

on:
  schedule:
    - cron: '0 20 * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy

    steps:
      - uses: actions/checkout@v4

      # -----------------------------
      # Slack: Main branch push alert
      # -----------------------------
      - name: Slack Alert - Main Branch Push
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{
            \"channel\": \"#automation-alerts\",
            \"text\": \"📌 *Main Branch Updated*\n\n📦 Repository: ${{ github.repository }}\n🌿 Branch: ${{ github.ref_name }}\n👤 Actor: ${{ github.actor }}\n🔗 Commit: https://github.com/${{ github.repository }}/commit/${{ github.sha }}\"
          }" \
          ${{ secrets.SLACK_WEBHOOK_URL }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required secrets
        run: |
          missing=""
          [ -z "$BASE_URL" ] && missing="$missing BASE_URL"
          [ -z "$EMAIL" ] && missing="$missing EMAIL"
          [ -z "$PASSWORD" ] && missing="$missing PASSWORD"
          [ -z "$OTP_SECRET" ] && missing="$missing OTP_SECRET"

          if [ -n "$missing" ]; then
            echo "❌ Missing required secrets:$missing"
            exit 1
          fi

          echo "✅ All required secrets are present"
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          OTP_SECRET: ${{ secrets.OTP_SECRET }}

      - name: Run Playwright tests
        run: npx playwright test
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          OTP_SECRET: ${{ secrets.OTP_SECRET }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Deploy report to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ !cancelled() }}
        with:
          github_token: ${{ secrets.HB_TOKEN }}
          publish_dir: playwright-report/
          destination_dir: reports/${{ github.run_id }}
          keep_files: true

      # -----------------------------
      # Slack: Success (with report links)
      # -----------------------------
      - name: Slack Alert - Test Success
        if: success()
        run: |
          RUN_REPORT="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/${{ github.run_id }}/"
          LATEST_REPORT="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/latest/"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -X POST -H 'Content-type: application/json' \
          --data "{
            \"channel\": \"#automation-alerts\",
            \"text\": \"✅ *Nightly Regression Passed*\n\n📦 Repo: ${{ github.repository }}\n🌿 Branch: ${{ github.ref_name }}\n\n📊 Reports:\n🔹 Run: ${RUN_REPORT}\n🔹 Latest: ${LATEST_REPORT}\n\n🔍 GitHub Run: ${RUN_URL}\"
          }" \
          ${{ secrets.SLACK_WEBHOOK_URL }}

      # -----------------------------
      # Slack: Failure (with report links)
      # -----------------------------
      - name: Slack Alert - Test Failed
        if: failure()
        run: |
          RUN_REPORT="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/${{ github.run_id }}/"
          LATEST_REPORT="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/latest/"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -X POST -H 'Content-type: application/json' \
          --data "{
            \"channel\": \"#automation-alerts\",
            \"text\": \"❌ *Nightly Regression Failed*\n\n📦 Repo: ${{ github.repository }}\n🌿 Branch: ${{ github.ref_name }}\n\n📊 Reports:\n🔹 Run: ${RUN_REPORT}\n🔹 Latest: ${LATEST_REPORT}\n\n🔍 Logs: ${RUN_URL}\"
          }" \
          ${{ secrets.SLACK_WEBHOOK_URL }}