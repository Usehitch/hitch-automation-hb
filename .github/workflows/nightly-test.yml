name: Nightly Regression Tests

on:
  schedule:
    - cron: '0 20 * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    timeout-minutes: 150
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy

    steps:
      - uses: actions/checkout@v4

      # -----------------------------
      # Slack: Main branch push alert
      # -----------------------------
      - name: Slack Alert - Main Branch Push
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{
            \"channel\": \"#automation-alerts\",
            \"text\": \"📌 *Main Branch Updated*\n\n📦 Repository: ${{ github.repository }}\n🌿 Branch: ${{ github.ref_name }}\n👤 Actor: ${{ github.actor }}\n🔗 Commit: https://github.com/${{ github.repository }}/commit/${{ github.sha }}\"
          }" \
          ${{ secrets.SLACK_WEBHOOK_URL }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # -----------------------------
      # Validate Secrets
      # -----------------------------
      - name: Validate required secrets
        run: |
          missing=""
          [ -z "$BASE_URL" ] && missing="$missing BASE_URL"
          [ -z "$EMAIL" ] && missing="$missing EMAIL"
          [ -z "$PASSWORD" ] && missing="$missing PASSWORD"
          [ -z "$OTP_SECRET" ] && missing="$missing OTP_SECRET"

          if [ -n "$missing" ]; then
            echo "❌ Missing required secrets:$missing"
            exit 1
          fi

          echo "✅ All required secrets are present"
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          OTP_SECRET: ${{ secrets.OTP_SECRET }}

      # -----------------------------
      # Run Playwright Tests
      # -----------------------------
      - name: Run Playwright tests
        id: playwright
        continue-on-error: true
        run: npx playwright test
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          OTP_SECRET: ${{ secrets.OTP_SECRET }}

      # -----------------------------
      # Install jq
      # -----------------------------
      - name: Install jq
        if: always()
        run: apt-get update -qq && apt-get install -y -qq jq

      # -----------------------------
      # Extract Test Statistics
      # -----------------------------
      - name: Extract test results
        if: always()
        run: |
          PASSED=$(jq '.stats.expected // 0' test-results.json)
          FAILED=$(jq '.stats.unexpected // 0' test-results.json)
          SKIPPED=$(jq '.stats.skipped // 0' test-results.json)

          echo "PASSED=$PASSED" >> $GITHUB_ENV
          echo "FAILED=$FAILED" >> $GITHUB_ENV
          echo "SKIPPED=$SKIPPED" >> $GITHUB_ENV

      # -----------------------------
      # Extract Failed Test Names
      # -----------------------------
      - name: Extract failed tests
        if: always()
        run: |
          FAILED_TESTS=$(jq -r '
            .suites[]?.specs[]? |
            select(any(.tests[]?.results[]?; .status=="failed")) |
            .title
          ' test-results.json)

          {
            echo "FAILED_TESTS<<EOF"
            echo "${FAILED_TESTS:-None}"
            echo "EOF"
          } >> $GITHUB_ENV

      # -----------------------------
      # Upload Playwright Report
      # -----------------------------
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # -----------------------------
      # Deploy Report to GitHub Pages
      # -----------------------------
      - name: Deploy report to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.HB_TOKEN }}
          publish_dir: playwright-report/
          destination_dir: reports/${{ github.run_id }}
          keep_files: true

      # -----------------------------
      # Slack Success Alert
      # -----------------------------
      - name: Slack Alert - Test Success
        if: env.FAILED == '0'
        run: |
          RUN_REPORT="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/${{ github.run_id }}/"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -X POST -H 'Content-type: application/json' \
          --data "{
            \"channel\": \"#automation-alerts\",
            \"text\": \"✅ *Nightly Regression Passed*\n\n📦 Repo: ${{ github.repository }}\n🌿 Branch: ${{ github.ref_name }}\n\n📈 Results:\n✅ Passed: ${PASSED}\n⏭️ Skipped: ${SKIPPED}\n❌ Failed: ${FAILED}\n\n📊 Report:\n${RUN_REPORT}\n\n🔍 GitHub Run:\n${RUN_URL}\"
          }" \
          ${{ secrets.SLACK_WEBHOOK_URL }}

      # -----------------------------
      # Slack Failure Alert
      # -----------------------------
      - name: Slack Alert - Test Failed
        if: env.FAILED != '0'
        run: |
          RUN_REPORT="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/${{ github.run_id }}/"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -X POST -H 'Content-type: application/json' \
          --data "{
            \"channel\": \"#automation-alerts\",
            \"text\": \"❌ *Nightly Regression Failed*\n\n📦 Repo: ${{ github.repository }}\n🌿 Branch: ${{ github.ref_name }}\n\n📈 Results:\n✅ Passed: ${PASSED}\n⏭️ Skipped: ${SKIPPED}\n❌ Failed: ${FAILED}\n\n🚨 Report:\n${RUN_REPORT}\n\n🔍 Logs:\n${RUN_URL}\"
          }" \
          ${{ secrets.SLACK_WEBHOOK_URL }}

      # -----------------------------
      # Mark Workflow Failed
      # -----------------------------
      - name: Fail workflow if tests failed
        if: env.FAILED != '0'
        run: |
          echo "One or more tests failed."
          exit 1