name: Nightly Regression Tests

on:
  schedule:
    - cron: '0 22 * * *'
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/playwright:v1.54.1-jammy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required secrets
        run: |
          missing=""
          [ -z "$BASE_URL" ] && missing="$missing BASE_URL"
          [ -z "$EMAIL" ] && missing="$missing EMAIL"
          [ -z "$PASSWORD" ] && missing="$missing PASSWORD"
          [ -z "$OTP_SECRET" ] && missing="$missing OTP_SECRET"

          if [ -n "$missing" ]; then
            echo "❌ Missing required repository secrets:$missing"
            exit 1
          fi

          echo "✅ All required secrets are present"
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          OTP_SECRET: ${{ secrets.OTP_SECRET }}

      - name: Run Playwright tests
        run: npx playwright test
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          OTP_SECRET: ${{ secrets.OTP_SECRET }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Deploy report to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ !cancelled() }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: playwright-report/
          destination_dir: reports/${{ github.run_id }}
          keep_files: true
